name: Desktop apps

# Builds the Tauri desktop app for Windows and macOS (universal: Intel + Apple Silicon).
# - Manual run (Actions tab > "Desktop apps" > Run workflow): installers as workflow artifacts.
# - Tag v* (e.g. v0.2.0): same, plus a draft GitHub release with the installers attached.
# Builds are unsigned for now: Windows SmartScreen and macOS Gatekeeper will warn on first launch.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: ''
            bundle: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            artifact: rastavec-windows
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            artifact: rastavec-macos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build desktop app (Tauri)
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Same app with a local WebView2 debugging port, used only by the end-to-end test.
      - name: Build E2E variant (debugging port)
        if: matrix.os == 'windows-latest'
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle --config e2e/tauri.e2e.conf.json

      - name: Upload E2E variant
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-windows
          path: src-tauri/target/${{ matrix.target }}/release/rastavec.exe
          if-no-files-found: error
          retention-days: 7

      # macOS: WKWebView has no CDP, so the test variant embeds an in-app harness
      # (src/lib/e2e-harness.ts, compiled in only when VITE_E2E_PORT is set).
      - name: Build E2E variant (in-app harness)
        if: matrix.os == 'macos-latest'
        env:
          VITE_E2E_PORT: '9555'
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle

      - name: Upload E2E variant
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-macos
          path: src-tauri/target/${{ matrix.target }}/release/rastavec
          if-no-files-found: error
          retention-days: 7

      # Cargo.lock is produced by the first build: keep it so it can be committed.
      - name: Upload Cargo.lock
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 14

  e2e-windows:
    name: Windows end-to-end test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: rastavec-windows
          path: installers

      - name: Install RastaVec (NSIS, silent)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\RastaVec", "$env:ProgramFiles\RastaVec" -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
            Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          if (-not $exe) { throw 'RastaVec executable not found after install' }
          Write-Host "Installed: $($exe.FullName)"
          "RASTAVEC_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Installed app starts
        shell: pwsh
        run: |
          $p = Start-Process $env:RASTAVEC_EXE -PassThru
          Start-Sleep -Seconds 12
          $wv = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object CommandLine -match 'webview-exe-name=rastavec.exe'
          if ($p.HasExited) { throw "Installed app exited with code $($p.ExitCode)" }
          if (-not $wv) { throw 'No WebView2 process for rastavec.exe' }
          Write-Host "Installed app running (pid $($p.Id)), WebView2 processes: $(@($wv).Count)"
          Stop-Process -Id $p.Id -Force
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

      - uses: actions/download-artifact@v8
        with:
          name: e2e-app-windows
          path: e2e-app

      - name: Ensure ffmpeg (screen recording)
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }

      - name: Run end-to-end test
        working-directory: e2e
        shell: pwsh
        run: |
          npm ci
          node desktop.mjs --app ../e2e-app/rastavec.exe --images ../assets/rastavec-path.png,../assets/rastavec-logo.png --out ../e2e-out --video

      - name: Upload screenshots, video and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-windows
          path: e2e-out
          retention-days: 14

  e2e-macos:
    name: macOS end-to-end test
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: rastavec-macos
          path: installers

      - name: Install RastaVec from the .dmg and check it starts
        run: |
          mkdir -p e2e-out
          dmg=$(find installers -name '*.dmg' | head -1)
          echo "Mounting $dmg"
          mnt=$(hdiutil attach "$dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | tail -1)
          cp -R "$mnt/RastaVec.app" /Applications/
          hdiutil detach "$mnt" -quiet
          lipo -archs /Applications/RastaVec.app/Contents/MacOS/rastavec
          open /Applications/RastaVec.app
          sleep 12
          screencapture -x e2e-out/00-installed-app.png || true
          pgrep -x rastavec || { echo "Installed app is not running"; exit 1; }
          echo "Installed app running"
          pkill -x rastavec || true
          sleep 2

      - uses: actions/download-artifact@v8
        with:
          name: e2e-app-macos
          path: e2e-app

      - name: Run end-to-end test
        run: |
          chmod +x e2e-app/rastavec
          node e2e/desktop-mac.mjs --app e2e-app/rastavec --images assets/rastavec-path.png,assets/rastavec-logo.png --out e2e-out

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-macos
          path: e2e-out
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: [build, e2e-windows, e2e-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Pack CLI
        working-directory: cli
        run: |
          npm ci
          npm run build
          mkdir -p ../installers
          npm pack --pack-destination ../installers

      - uses: actions/download-artifact@v8
        with:
          pattern: rastavec-*
          path: installers
          merge-multiple: true

      - name: Flatten installers
        run: |
          find installers -mindepth 2 -type f -exec mv -t installers {} +
          find installers -mindepth 1 -type d -delete
          rm -f installers/Cargo.lock
          ls -la installers

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: RastaVec ${{ github.ref_name }}
          files: installers/*
          body: |
            RastaVec ${{ github.ref_name }}: raster to SVG, deterministic and 100% local.

            ## Desktop app
            - Windows: `RastaVec_*_x64-setup.exe` (recommended) or `.msi`
            - macOS (Intel and Apple Silicon): `RastaVec_*_universal.dmg`

            ## Command line
            `rastavec-*.tgz`: `npm install -g ./rastavec-<version>.tgz`, then `rastavec trace logo.png`.
            See `cli/README.md`.

            ## Known limitations
            - Builds are not code-signed yet: Windows SmartScreen ("More info" > "Run anyway")
              and macOS Gatekeeper (System Settings > Privacy & Security > "Open Anyway") warn on first launch.
            - The Animate screen is not available yet.
