name: Desktop apps

# Builds the Tauri desktop app for Windows and macOS (universal: Intel + Apple Silicon).
# - Manual run (Actions tab > "Desktop apps" > Run workflow): installers as workflow artifacts.
# - Tag v* (e.g. v0.2.0): same, plus a draft GitHub release with the installers attached.
# Builds are unsigned for now: Windows SmartScreen and macOS Gatekeeper will warn on first launch.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: ''
            bundle: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            artifact: rastavec-windows
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            artifact: rastavec-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build desktop app (Tauri)
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Cargo.lock is produced by the first build: keep it so it can be committed.
      - name: Upload Cargo.lock
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Pack CLI
        working-directory: cli
        run: |
          npm ci
          npm run build
          mkdir -p ../installers
          npm pack --pack-destination ../installers

      - uses: actions/download-artifact@v4
        with:
          pattern: rastavec-*
          path: installers
          merge-multiple: true

      - name: Flatten installers
        run: |
          find installers -mindepth 2 -type f -exec mv -t installers {} +
          find installers -mindepth 1 -type d -delete
          rm -f installers/Cargo.lock
          ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: RastaVec ${{ github.ref_name }}
          files: installers/*
          body: |
            RastaVec ${{ github.ref_name }}: raster to SVG, deterministic and 100% local.

            ## Desktop app
            - Windows: `RastaVec_*_x64-setup.exe` (recommended) or `.msi`
            - macOS (Intel and Apple Silicon): `RastaVec_*_universal.dmg`

            ## Command line
            `rastavec-*.tgz`: `npm install -g ./rastavec-<version>.tgz`, then `rastavec trace logo.png`.
            See `cli/README.md`.

            ## Known limitations
            - Builds are not code-signed yet: Windows SmartScreen ("More info" > "Run anyway")
              and macOS Gatekeeper (right-click > Open) warn on first launch.
            - Edit and Animate screens are not available yet.
