name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type-check & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Run web regression tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: rastavec-web
          path: dist
          retention-days: 7

  cli:
    name: CLI build & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Type-check (CLI + shared engine)
        run: npm run check

      - name: Build and run CLI regression tests
        run: npm test

      - name: Smoke test (trace + analyze + slice, JSON contract)
        run: |
          node dist/rastavec.cjs --version
          node dist/rastavec.cjs trace ../assets/rastavec-path.png -o "$RUNNER_TEMP/out" --compare --json > "$RUNNER_TEMP/report.json"
          node -e "const r=require(process.argv[1]); if (r.schemaVersion!==1||r.summary.total!==1||r.summary.errors!==0||r.items[0].status!=='ok') { console.error(JSON.stringify(r.summary)); process.exit(1) } console.log('trace ok', r.items[0].metrics)" "$RUNNER_TEMP/report.json"
          test -f "$RUNNER_TEMP/out/rastavec-path.svg" && test -f "$RUNNER_TEMP/out/rastavec-path.comparison.png"
          node dist/rastavec.cjs analyze ../assets --json > /dev/null
          set +e; node dist/rastavec.cjs trace does-not-exist.png; code=$?; set -e
          test "$code" = "2"
