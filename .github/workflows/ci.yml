name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type-check & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The web regression suite uses sharp from the CLI workspace to compare rendered SVGs.
      - name: Install CLI test dependencies
        run: npm ci --prefix cli

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Run web regression tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Check bundled VTracer-Next WASM
        run: |
          set -- dist/assets/vtracer_next_bg-*.wasm
          test "$#" -eq 1
          cmp "$1" src/lib/engine/vtracer-next-wasm/vtracer_next_bg.wasm

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: rastavec-web
          path: dist
          retention-days: 7

  cli:
    name: CLI build & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Type-check (CLI + shared engine)
        run: npm run check

      - name: Build and run CLI regression tests
        run: npm test

      - name: Install and smoke-test the packed CLI
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          package_path="$RUNNER_TEMP/rastavec-$(node -p 'require("./package.json").version').tgz"
          install_path="$RUNNER_TEMP/rastavec-cli-install"
          npm install --prefix "$install_path" --ignore-scripts --no-audit --no-fund "$package_path"
          cli="$install_path/node_modules/.bin/rastavec"
          "$cli" --version
          "$cli" trace ../assets/rastavec-path.png -o "$RUNNER_TEMP/out" --compare --json > "$RUNNER_TEMP/report.json"
          node -e "const r=require(process.argv[1]); if (r.schemaVersion!==1||r.traceEngine!=='next'||r.summary.total!==1||r.summary.errors!==0||r.items[0].status!=='ok') { console.error(JSON.stringify(r.summary)); process.exit(1) } console.log('trace ok', r.items[0].metrics)" "$RUNNER_TEMP/report.json"
          test -f "$RUNNER_TEMP/out/rastavec-path.svg" && test -f "$RUNNER_TEMP/out/rastavec-path.comparison.png"
          "$cli" analyze ../assets --json > /dev/null
          set +e; "$cli" trace does-not-exist.png; code=$?; set -e
          test "$code" = "2"
