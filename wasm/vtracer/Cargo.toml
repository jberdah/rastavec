[package]
name = "rastavec-vtracer-wasm"
version = "0.1.0"
edition = "2024"
description = "Browser WebAssembly adapter for VTracer 1 in RastaVec"
license = "Apache-2.0"
repository = "https://github.com/jberdah/rastavec"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vtracer = "=1.0.0-alpha.4"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
